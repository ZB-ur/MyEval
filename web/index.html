<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MyEval · Agent 评测</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#"><span class="brand-mark">M</span><span>MyEval<small>AGENT EVALUATION</small></span></a>
    <div class="workspace-label">本地工作区</div>
    <nav><a href="#" id="nav-experiments" class="active"><span>◫</span>实验</a><a href="#catalog" id="nav-catalog"><span>▤</span>任务包与能力</a><a href="#guide" id="nav-guide"><span>↗</span>使用说明</a></nav>
    <div class="sidebar-bottom"><span class="live-dot"></span> 仅本机访问<p>真实业务路径<br>可追溯的每一次尝试</p><span class="version">MyEval 0.1 · 开发版</span></div>
  </aside>
  <div class="shell"><header class="topbar"><span id="breadcrumb">工作区 / 实验</span><span class="top-status" id="service-state">连接中</span></header><main id="app" tabindex="-1"><div class="empty">正在读取本地证据…</div></main></div>
  <dialog id="create-dialog"><form id="create-form"><div class="dialog-head"><div><span class="eyebrow">NEW EXPERIMENT</span><h2>建立一组可比较的运行</h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="关闭">×</button></div><p class="muted">相同案例、两种配置。每一次请求和失败都将留下记录。</p><label>实验名称<input name="title" id="experiment-title" placeholder="如：发现与复盘 · 首轮边界检查" maxlength="160"></label><label>项目与任务包<select name="project" id="project-select" required></select></label><div id="pack-info"></div><fieldset><legend>选择案例</legend><div id="case-choices"></div></fieldset><div class="form-grid"><label>基线配置<select name="baseline_id" id="baseline-select"></select></label><label>候选配置<select name="candidate_id" id="candidate-select"></select></label></div><div id="config-info" class="notice"></div><div class="form-grid"><label>每配置重复次数<select name="repeats"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option><option value="5">5 次</option></select><small>重复采样不增加独立案例数</small></label><label>每 trial 超时（秒）<input type="number" name="timeout_seconds" min="5" max="900" value="300" required><small>到时停止本地执行并保留轨迹</small></label></div><p id="create-error" class="error-text" role="alert"></p><div class="dialog-footer"><span class="muted" id="trial-count"></span><button class="primary" type="submit">启动真实实验 <span>↗</span></button></div></form></dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
